<svg width="760" height="180" viewBox="0 0 760 180"
        xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Maija profile banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <style>
        .bg { fill: rgba(198, 114, 157); }
        .name {
        font-family: monospace;
        font-size: 3rem;
        font-weight: 700;
        fill: white;
        }
        .tagline {
        font-family: Helvetica Neue;
        font-size: 1.5rem;
        fill: #f6c453;
        }

        /* auto dark/light adjust based on the viewer's system theme */
        @media (prefers-color-scheme: dark) {
        .bg { fill: rgb(198, 114, 158); }
        .name { fill: #2b2438; }
        .tagline { fill: #b8842f; }
        }
    </style>

    <rect class="bg" width="760" height="180" rx="14" />

    <text x="40" y="80" class="name">Hello World!</text>
    <text x="40" y="130" class="tagline">My name is Maija. Welcome to my GitHub!</text>
</svg>